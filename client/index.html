    <script type="text/javascript">
      (function () {
        // Painel restrito: nenhum script de terceiros roda junto da chave de acesso.
        if (location.pathname.indexOf("/painel") === 0 || location.pathname.indexOf("/giselle/painel") === 0) return;
        var pid = "%VITE_LINKEDIN_PARTNER_ID%";
        if (!pid || pid.indexOf("%") === 0) return;
        window._linkedin_partner_id = pid;
        window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
        window._linkedin_data_partner_ids.push(pid);
        if (!window.lintrk) {
          window.lintrk = function (a, b) { window.lintrk.q.push([a, b]); };
          window.lintrk.q = [];
        }
        var s = document.getElementsByTagName("script")[0];
        var b = document.createElement("script");
        b.type = "text/javascript"; b.async = true;
        b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
        s.parentNode.insertBefore(b, s);
      })();
    </script>

    <script type="text/javascript">
      // Badge do LinkedIn e umami carregam em todo o site, EXCETO no painel
      // restrito — scripts de terceiros não convivem com a chave de acesso.
      (function () {
        if (location.pathname.indexOf("/painel") === 0 || location.pathname.indexOf("/giselle/painel") === 0) return;
        var b = document.createElement("script");
        b.src = "https://platform.linkedin.com/badges/js/profile.js";
        b.async = true; b.defer = true;
        document.body.appendChild(b);
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        if (endpoint && endpoint.indexOf("%") !== 0) {
          var u = document.createElement("script");
          u.defer = true;
          u.src = endpoint + "/umami";
          u.setAttribute("data-website-id", "%VITE_ANALYTICS_WEBSITE_ID%");
          document.body.appendChild(u);
        }
      })();
    </script>
